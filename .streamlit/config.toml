[theme]
base = "dark"
primaryColor = "#A855F7"
backgroundColor = "#0A0A0B"
secondaryBackgroundColor = "#161618"
textColor = "#F5F5F7"
linkColor = "#93C5FD"
borderColor = "#2A2A2E"
font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "1.25rem"
buttonRadius = "999rem"
baseFontSize = 16
widgetBorderColor = "#2A2A2E"
showWidgetBorder = true
showSidebarBorder = false

blueColor = "#3B82F6"
violetColor = "#A855F7"
orangeColor = "#FF7A59"
grayColor = "#8B8B93"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
