[theme]
base = "dark"
primaryColor = "#7C3AED"
backgroundColor = "#0B0F1A"
secondaryBackgroundColor = "#141A2A"
textColor = "#E8ECF5"
linkColor = "#93C5FD"
borderColor = "#2A3350"
font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "1.1rem"
buttonRadius = "999rem"
baseFontSize = 16
widgetBorderColor = "#3B4668"
showWidgetBorder = true
showSidebarBorder = false

blueColor = "#2563EB"
blueBackgroundColor = "#1E293B"
violetColor = "#7C3AED"
violetBackgroundColor = "#1E1B4B"
grayColor = "#94A3B8"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
